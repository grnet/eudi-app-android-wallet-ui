# GRNET fork: build the signed dev-flavour APK and publish it as a GitHub
# Release. See .github/README.md, "Releases".
#
# - latest: grnet's HEAD, rebuilt when a pull request is merged into grnet, or
#   by hand with the branch grnet. Always the release marked Latest.
# - preview-<branch>: the HEAD of any other branch, built by hand, for others to
#   try a branch that is not merged. A pre-release, never Latest; a new run on
#   the same branch replaces it.
# - a v* tag: a permanent release, not Latest either.
#
# One workflow for all of them: the version code is its run number, so it rises
# across them, and each APK installs over the one before, whichever it was.

name: APK build

on:
  pull_request:
    types: [closed]
    branches:
      - grnet
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build: grnet rebuilds latest; any other publishes a preview of it'
        required: true
        default: grnet
        type: string
      # The trust build arguments of AndroidLibraryConventionPlugin. The defaults
      # are the payment demo's; a merged pull request always builds with them.
      trust_lists:
        description: 'Trusted lists: ri (upstream''s) or ec (the Commission''s, for the Launchpad testbed)'
        required: true
        default: ri
        type: choice
        options:
          - ri
          - ec
      empty_trust_lists:
        description: 'With ec only: lists read from their empty twin, any of pid,wrpac,wrprc (negative tests)'
        required: false
        default: ''
        type: string
      grnet_trust_anchors:
        description: 'GRNET''s own CAs back up the lists (off for negative tests)'
        required: true
        default: true
        type: boolean
      registration_check:
        description: '"Check Registration Certificates" starts on (the testbed''s PRE-09 to PRE-14)'
        required: true
        default: false
        type: boolean

concurrency:
  group: apk-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event_name == 'pull_request' && 'grnet' || github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: eudi-wallet-gr.apk

jobs:
  build:
    name: Build and publish
    # A pull request closed without merging builds nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # What is built, and released as what.
      - name: Choose the release
        id: release
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            kind=tag ref="$GITHUB_REF" source="tag $GITHUB_REF_NAME" tag="$GITHUB_REF_NAME"
            title="EUDI Wallet GR $GITHUB_REF_NAME" suffix=""
          elif [[ "$EVENT" == "pull_request" || "$BRANCH" == "grnet" ]]; then
            kind=latest ref=grnet source=grnet tag=latest
            title="EUDI Wallet GR, latest" suffix=""
          else
            git check-ref-format --branch "$BRANCH" > /dev/null || {
              echo "::error::not a branch name: $BRANCH"; exit 1; }
            kind=preview ref="$BRANCH" source="$BRANCH"
            tag="preview-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
            title="EUDI Wallet GR, preview of $BRANCH" suffix="-preview"
          fi
          {
            echo "kind=$kind"; echo "ref=$ref"; echo "source=$source"
            echo "tag=$tag"; echo "title=$title"; echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
          echo "$kind release $tag from $source"

      # The trust settings. Empty inputs (a merged pull request, a tag) get the
      # defaults; latest is always built with them, so the payment demo keeps
      # working whatever is typed in.
      - name: Choose the trust settings
        id: trust
        env:
          KIND: ${{ steps.release.outputs.kind }}
          TRUST_LISTS: ${{ inputs.trust_lists }}
          EMPTY_TRUST_LISTS: ${{ inputs.empty_trust_lists }}
          GRNET_TRUST_ANCHORS: ${{ inputs.grnet_trust_anchors }}
          REGISTRATION_CHECK: ${{ inputs.registration_check }}
        run: |
          set -euo pipefail
          lists="${TRUST_LISTS:-ri}" empty="${EMPTY_TRUST_LISTS:-}" anchors="${GRNET_TRUST_ANCHORS:-true}"
          regcheck="${REGISTRATION_CHECK:-false}"
          if [[ "$KIND" == "latest" && ( "$lists" != ri || -n "$empty" || "$anchors" != true || "$regcheck" != false ) ]]; then
            echo "::error::latest is always built with the default trust settings; build a preview of another branch instead"
            exit 1
          fi
          empty="$(printf '%s' "$empty" | tr -d ' ')"
          if [[ -n "$empty" ]]; then
            [[ "$lists" == ec ]] || { echo "::error::empty_trust_lists needs trust_lists=ec"; exit 1; }
            [[ "$empty" =~ ^(pid|wrpac|wrprc)(,(pid|wrpac|wrprc))*$ ]] || {
              echo "::error::empty_trust_lists: any of pid,wrpac,wrprc, comma-separated"; exit 1; }
          fi
          case "$lists" in
            ri) line="Trusted lists: upstream's" ;;
            ec) line="Trusted lists: the Commission's (Launchpad testbed)${empty:+, empty: $empty}" ;;
          esac
          [[ "$anchors" == true ]] && line="$line, GRNET's CAs as fallback" || line="$line, no GRNET fallback"
          [[ "$regcheck" == true ]] && line="$line; registration certificates checked by default"
          {
            echo "lists=$lists"; echo "empty=$empty"; echo "anchors=$anchors"; echo "regcheck=$regcheck"; echo "line=$line"
          } >> "$GITHUB_OUTPUT"
          echo "$line"

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Check secrets and variables
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ISSUER_URLS: ${{ vars.ISSUER_URLS }}
          WALLET_PROVIDER_URL: ${{ vars.WALLET_PROVIDER_URL }}
        run: |
          set -euo pipefail
          for k in ANDROID_KEYSTORE_B64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ISSUER_URLS WALLET_PROVIDER_URL; do
            if [[ -z "${!k:-}" ]]; then
              echo "::error::$k is not set; see .github/README.md, \"Releases\""
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The release signing config reads the keystore from ./sign.
      - name: Install the signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > sign

      # versionCode rises with every run, so each APK installs over the last.
      # The version name is written here, not committed; a preview's ends in
      # -preview. The commit is the one checked out, not the one the workflow
      # ran from.
      - name: Set the version
        id: version
        env:
          SUFFIX: ${{ steps.release.outputs.suffix }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          name="$(date -u +%Y.%m).${GITHUB_RUN_NUMBER}-${sha::7}${SUFFIX}"
          echo "VERSION_NAME=${name}" > version.properties
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version ${name}, code ${GITHUB_RUN_NUMBER}"

      # Resolved before the build, with the GRNET artifacts dropped from the
      # Gradle cache that setup-gradle restores, so the log shows each one
      # being downloaded and from where.
      - name: Show where wallet-core comes from
        id: walletcore
        run: |
          set -euo pipefail
          rm -rf ~/.gradle/caches/modules-2/files-2.1/eu.europa.ec.eudi/eudi-lib-android-*/*-grnet.* \
                 ~/.gradle/caches/modules-2/metadata-*/descriptors/eu.europa.ec.eudi/eudi-lib-android-*/*-grnet.*
          ./gradlew :app:dependencies --configuration devDebugRuntimeClasspath --info --no-configuration-cache \
            -PissuerUrls=x -PwalletProviderUrl=x > deps.log 2>&1
          grep -oE 'Downloading https://[^ ]*eudi-lib-android-(wallet-core|wallet-document-manager|iso18013-data-transfer)[^ ]*\.pom' deps.log \
            | sed 's/^Downloading //' | sort -u > walletcore-sources.txt || true
          grep -oE 'eu\.europa\.ec\.eudi:eudi-lib-android-(wallet-core|wallet-document-manager|iso18013-data-transfer):[^ ]+' deps.log \
            | sort -u > walletcore-versions.txt
          cat walletcore-versions.txt walletcore-sources.txt
          {
            echo "### wallet-core"
            echo '```'
            cat walletcore-versions.txt walletcore-sources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          version=$(grep -m1 ':eudi-lib-android-wallet-core:' walletcore-versions.txt | awk -F: '{print $3}')
          source=$(grep -m1 'eudi-lib-android-wallet-core/' walletcore-sources.txt | sed -E 's#(/maven/).*#\1#' || true)
          echo "line=wallet-core: ${version}${source:+ from ${source}}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDevDebug \
            -PsignDebugWithReleaseKey=true \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PissuerUrls="${{ vars.ISSUER_URLS }}" \
            -PwalletProviderUrl="${{ vars.WALLET_PROVIDER_URL }}" \
            -PtrustLists="${{ steps.trust.outputs.lists }}" \
            -PemptyTrustLists="${{ steps.trust.outputs.empty }}" \
            -PgrnetTrustAnchors="${{ steps.trust.outputs.anchors }}" \
            -PregistrationCheckDefault="${{ steps.trust.outputs.regcheck }}"

      - name: Check the signature
        id: apk
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/dev/debug -name '*.apk' | head -1)
          [[ -n "$apk" ]] || { echo "::error::no APK built"; exit 1; }
          cp "$apk" "$APK_NAME"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$APK_NAME" | tee signer.txt
          cert=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print $NF}')
          echo "cert=${cert}" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.release.outputs.kind }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          SOURCE: ${{ steps.release.outputs.source }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          notes=$(printf '%s\n' \
            "EUDI Wallet GR, dev flavour, version ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})." \
            "" \
            "Built from ${SHA} on ${SOURCE}." \
            "Issuers: ${{ vars.ISSUER_URLS }}" \
            "Wallet provider: ${{ vars.WALLET_PROVIDER_URL }}" \
            "${{ steps.trust.outputs.line }}" \
            "${{ steps.walletcore.outputs.line }}" \
            "Signing certificate SHA-256: ${{ steps.apk.outputs.cert }}")
          if [[ "$KIND" == "preview" ]]; then
            notes=$(printf '%s\n\n%s' \
              "A preview of the branch ${SOURCE}, to try it out: not merged into grnet. A new build of the branch replaces it." \
              "$notes")
          fi

          case "$KIND" in
            tag)
              gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
                --title "$TITLE" --notes "$notes" --verify-tag --latest=false
              ;;
            latest)
              gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
              gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
                --target "$SHA" --title "$TITLE" --notes "$notes" --latest
              ;;
            preview)
              gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
              gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
                --target "$SHA" --title "$TITLE" --notes "$notes" --prerelease --latest=false
              ;;
          esac
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
