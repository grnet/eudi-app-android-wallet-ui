# GRNET fork: build the signed dev-flavour APK and publish it as a GitHub
# Release. See .github/README.md, "Releases".
#
# Only grnet and v* tags are published. A push to grnet, which is what merging
# a pull request is, replaces the release latest-grnet; a v* tag makes a
# permanent one. A manual run on any other branch attaches the APK to the run
# instead, so work in progress never reaches the releases page.

name: APK build

on:
  push:
    branches:
      - grnet
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: eudi-wallet-gr.apk

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check secrets and variables
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ISSUER_URLS: ${{ vars.ISSUER_URLS }}
          WALLET_PROVIDER_URL: ${{ vars.WALLET_PROVIDER_URL }}
        run: |
          set -euo pipefail
          for k in ANDROID_KEYSTORE_B64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ISSUER_URLS WALLET_PROVIDER_URL; do
            if [[ -z "${!k:-}" ]]; then
              echo "::error::$k is not set; see .github/README.md, \"Releases\""
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The release signing config reads the keystore from ./sign.
      - name: Install the signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > sign

      # versionCode rises with every run, so each APK installs over the last.
      # The version name is written here, not committed.
      - name: Set the version
        id: version
        run: |
          set -euo pipefail
          name="$(date -u +%Y.%m).${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "VERSION_NAME=${name}" > version.properties
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version ${name}, code ${GITHUB_RUN_NUMBER}"

      # Resolved before the build, with the GRNET artifacts dropped from the
      # Gradle cache that setup-gradle restores, so the log shows each one
      # being downloaded and from where.
      - name: Show where wallet-core comes from
        id: walletcore
        run: |
          set -euo pipefail
          rm -rf ~/.gradle/caches/modules-2/files-2.1/eu.europa.ec.eudi/eudi-lib-android-*/*-grnet.* \
                 ~/.gradle/caches/modules-2/metadata-*/descriptors/eu.europa.ec.eudi/eudi-lib-android-*/*-grnet.*
          ./gradlew :app:dependencies --configuration devReleaseRuntimeClasspath --info --no-configuration-cache \
            -PissuerUrls=x -PwalletProviderUrl=x > deps.log 2>&1
          grep -oE 'Downloading https://[^ ]*eudi-lib-android-(wallet-core|wallet-document-manager|iso18013-data-transfer)[^ ]*\.pom' deps.log \
            | sed 's/^Downloading //' | sort -u > walletcore-sources.txt || true
          grep -oE 'eu\.europa\.ec\.eudi:eudi-lib-android-(wallet-core|wallet-document-manager|iso18013-data-transfer):[^ ]+' deps.log \
            | sort -u > walletcore-versions.txt
          cat walletcore-versions.txt walletcore-sources.txt
          {
            echo "### wallet-core"
            echo '```'
            cat walletcore-versions.txt walletcore-sources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          version=$(grep -m1 ':eudi-lib-android-wallet-core:' walletcore-versions.txt | awk -F: '{print $3}')
          source=$(grep -m1 'eudi-lib-android-wallet-core/' walletcore-sources.txt | sed -E 's#(/maven/).*#\1#' || true)
          echo "line=wallet-core: ${version}${source:+ from ${source}}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDevRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PissuerUrls="${{ vars.ISSUER_URLS }}" \
            -PwalletProviderUrl="${{ vars.WALLET_PROVIDER_URL }}"

      - name: Check the signature
        id: apk
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/dev/release -name '*.apk' | head -1)
          [[ -n "$apk" ]] || { echo "::error::no APK built"; exit 1; }
          cp "$apk" "$APK_NAME"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$APK_NAME" | tee signer.txt
          cert=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print $NF}')
          echo "cert=${cert}" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Attach the APK to the run
        if: github.ref_type != 'tag' && github.ref_name != 'grnet'
        uses: actions/upload-artifact@v4
        with:
          name: eudi-wallet-gr-${{ steps.version.outputs.name }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

      - name: Publish the release
        if: github.ref_type == 'tag' || github.ref_name == 'grnet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(printf '%s\n' \
            "EUDI Wallet GR, dev flavour, version ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})." \
            "" \
            "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}." \
            "Issuers: ${{ vars.ISSUER_URLS }}" \
            "Wallet provider: ${{ vars.WALLET_PROVIDER_URL }}" \
            "${{ steps.walletcore.outputs.line }}" \
            "Signing certificate SHA-256: ${{ steps.apk.outputs.cert }}")

          # A tag is a deliberate release, so it becomes Latest. latest-grnet is
          # Latest only until the first v* tag exists.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" "$APK_NAME.sha256" \
              --title "EUDI Wallet GR ${GITHUB_REF_NAME}" --notes "$notes" --verify-tag --latest
          else
            tag="latest-grnet"
            latest=true
            if gh release list --limit 100 --json tagName -q '.[].tagName' | grep -q '^v'; then
              latest=false
            fi
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$tag" "$APK_NAME" "$APK_NAME.sha256" \
              --target "$GITHUB_SHA" --latest="$latest" \
              --title "EUDI Wallet GR, latest grnet" --notes "$notes"
          fi
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APK_NAME}"
